name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - run: npm test
      - run: npm run pack:check

  spring-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: roomescape
          POSTGRES_USER: roomescape
          POSTGRES_PASSWORD: roomescape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomescape -d roomescape"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ROOMESCAPE_POSTGRES_URL: jdbc:postgresql://localhost:5432/roomescape
      ROOMESCAPE_POSTGRES_USER: roomescape
      ROOMESCAPE_POSTGRES_PASSWORD: roomescape
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon --console=plain -q test
        working-directory: test/fixtures/roomescape-cancel-booking-penalty
