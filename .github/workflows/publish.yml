# Guarded publication contract. The workflow_dispatch entry is a temporary
# recovery path for v0.1.0: it still requires an immutable tag, exact commit,
# protected environment approval, and the npm Trusted Publisher documented in
# docs/RELEASING.md.
name: Publish npm release

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable vX.Y.Z tag to publish
        required: true
        type: string
      release_sha:
        description: Exact 40-character commit bound to the tag
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the approved release tag to npm
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      RELEASE_SHA: ${{ github.event_name == 'release' && github.sha || inputs.release_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate frozen release coordinates
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the frozen release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 21 for Spring verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Use the supported Node.js release
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Bind the immutable tag and release commit to main
        run: |
          git fetch origin main --no-tags
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --no-tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run the full test suite
        run: npm test
      - name: Bind release metadata and packed files to the tag
        run: npm run release:check -- --tag "$RELEASE_TAG" --publish
      - name: Inspect the exact package allowlist without lifecycle scripts
        run: npm run pack:check
      - name: Publish through npm Trusted Publishing
        run: npm publish --access public
