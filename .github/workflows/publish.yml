# Guarded publication contract. This workflow remains release-only and requires
# the repository variable, protected environment, and npm Trusted Publisher
# documented in docs/RELEASING.md.
name: Publish npm release

"on":
  release:
    types:
      - published

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the approved release tag to npm
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 21 for Spring verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Use the supported Node.js release
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Require the release commit to belong to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run the full test suite
        run: npm test
      - name: Bind release metadata and packed files to the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run release:check -- --tag "$RELEASE_TAG" --publish
      - name: Inspect the exact package allowlist without lifecycle scripts
        run: npm run pack:check
      - name: Publish through npm Trusted Publishing
        run: npm publish --access public
