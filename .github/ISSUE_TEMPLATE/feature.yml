name: Feature proposal
description: Propose a bounded product capability.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable completion conditions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the files, contracts, or product behavior this proposal may change.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State adjacent work that must remain outside this issue and pull request.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: Describe trust-boundary, compatibility, or delivery risk and how the change can be reverted.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Product layer
      options:
        - execution kernel
        - workflow gates
        - skill or policy
        - adapter
        - developer experience
        - release engineering
    validations:
      required: true
  - type: dropdown
    id: release_impact
    attributes:
      label: Release impact
      description: Select the expected SemVer impact; the pull request must confirm it from the implemented diff.
      options:
        - none
        - patch
        - minor
        - breaking
    validations:
      required: true
